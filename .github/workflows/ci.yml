name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ein laufender Durchgang je Branch reicht. Auf main wird nichts abgebrochen:
# ein abgebrochener Lauf kann mitten im Deploy stehen, und jeder Stand von main
# geht der Reihe nach durch die Gates.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # wrangler meldet sonst Nutzungsdaten an Cloudflare (CLAUDE.md 2.6).
  WRANGLER_SEND_METRICS: 'false'

jobs:
  qualitaet:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatierung
        run: npm run format:check

      - name: Unit-Tests
        run: npm test

      # CLAUDE.md 3: ein Finanzprodukt mit rotem Audit verliert sein Kapital.
      - name: Sicherheitsaudit
        run: npm run audit:ci

      # Bricht ab bei Platzhaltern im Output und bei ungültiger Sitemap.
      - name: Build
        run: npm run build

      # Dieses Artefakt prüfen e2e und lighthouse, und genau dieses lädt deploy
      # hoch. Kein Job baut ein zweites Mal.
      - name: Build-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Smoke-Tests
    runs-on: ubuntu-latest
    needs: qualitaet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      # Liefert dist über wrangler pages dev aus, wie Cloudflare Pages.
      - name: Playwright
        run: npm run test:e2e

      - name: Bericht sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: qualitaet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # lhci laeuft bewusst per npx und steht nicht in package.json: sein
      # Abhaengigkeitsbaum wuerde sonst das Audit-Gate dauerhaft rot faerben.
      # Die Version ist exakt gepinnt, damit die Gates nicht ueber Nacht
      # wandern. Chrome ist auf ubuntu-latest vorinstalliert.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Berichte sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # Variante B: GitHub Actions baut, Cloudflare Pages bekommt nur das fertige,
  # geprüfte Artefakt (Direct Upload). Läuft nur auf main und nur, wenn alle
  # Gates grün sind — ein roter Job oben heisst: kein Deploy.
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [qualitaet, e2e, lighthouse]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Die Secrets liegen in der Umgebung "production", die nur main nutzen darf.
    environment:
      name: production
      url: https://daxolo.ch
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Nur für package.json: dort ist die wrangler-Version gepinnt.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Hochladen
        run: >-
          npm run -s wrangler -- pages deploy dist
          --project-name=daxolo
          --branch=main
          --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
